<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative "Fell-ian" Drum Synth</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #0a0a0a; color: #e0e0e0; padding: 20px; min-height: 100vh; overflow-x: hidden; overflow-y: auto; }
        .container { max-width: 1400px; margin: 0 auto; padding-bottom: 40px; }
        h1 { font-size: 24px; margin-bottom: 20px; letter-spacing: 2px; font-weight: 300; }
        .transport { background: #1a1a1a; padding: 20px; margin-bottom: 20px; border: 1px solid #333; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        .btn { background: #2a2a2a; border: 1px solid #444; color: #e0e0e0; padding: 12px 24px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 14px; transition: all 0.2s; }
        .btn:hover { background: #3a3a3a; border-color: #666; }
        .btn.active { background: #00ff00; color: #000; border-color: #00ff00; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        input[type="range"] { width: 120px; height: 4px; background: #333; outline: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #00ff00; cursor: pointer; }
        input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; background: #00ff00; cursor: pointer; border: none; }
        input[type="number"] { background: #2a2a2a; border: 1px solid #444; color: #e0e0e0; padding: 8px; width: 60px; font-family: 'Courier New', monospace; font-size: 14px; }
        .drum-channel { background: #1a1a1a; border: 1px solid #333; padding: 20px; margin-bottom: 15px; }
        .channel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .channel-name { font-size: 16px; letter-spacing: 1px; }
        .channel-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .param-section { border-left: 2px solid #333; padding-left: 15px; }
        .param-section h3 { font-size: 12px; color: #888; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 300; }
        .param-control { margin-bottom: 12px; }
        .param-control label { display: block; font-size: 10px; color: #666; margin-bottom: 5px; text-transform: uppercase; }
        .param-value { font-size: 11px; color: #00ff00; display: inline-block; margin-left: 10px; min-width: 50px; }
        .step-display { display: flex; gap: 4px; margin-top: 10px; padding: 10px; background: #0a0a0a; border: 1px solid #222; flex-wrap: wrap; height: 52px; align-content: flex-start; }
        .step { width: 16px; height: 16px; background: #2a2a2a; border: 1px solid #444; transition: all 0.1s; }
        .step.active { background: #00ff00; }
        .step.playing { background: #ffff00; box-shadow: 0 0 10px #ffff00; }
        .mute-btn { padding: 8px 16px; font-size: 12px; }
        .mute-btn.muted { background: #ff0000; color: #fff; border-color: #ff0000; }
        select { background: #2a2a2a; border: 1px solid #444; color: #e0e0e0; padding: 8px; font-family: 'Courier New', monospace; font-size: 12px; }
        h2 { font-size: 14px; font-weight: 300; letter-spacing: 2px; margin-bottom: 10px; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GENERATIVE DRUM SYNTHESIZER</h1>
        
        <div class="transport">
            <button id="playBtn" class="btn">PLAY</button>
            <button id="stopBtn" class="btn">STOP</button>
            <div class="control-group">
                <label>Master Tempo (BPM)</label>
                <input type="number" id="bpmInput" value="125" min="40" max="240" step="1">
            </div>
            <div class="control-group">
                <label>Master Volume</label>
                <input type="range" id="masterVolume" min="-40" max="6" value="-6" step="1">
                <span class="param-value" id="masterVolumeValue">-6 dB</span>
            </div>
        </div>

        <div id="channels"></div>
    </div>

    <script>
    // --- NEW: Pattern Synthesis Algorithm ---
    function generateFellPattern(steps, patternA, patternB, fill, phase) {
        const pattern = new Array(steps).fill(false);
        if (patternA <= 0 || patternB <= 0) return pattern;

        for (let i = 0; i < steps; i++) {
            // A step is a *potential* trigger if it falls on the grid of Pattern A or Pattern B
            const isPotentialTrigger = (i % patternA === 0) || ((i + phase) % patternB === 0);
            
            if (isPotentialTrigger && Math.random() < fill) {
                pattern[i] = true;
            }
        }
        return pattern;
    }

    // --- MODIFIED: Drum machine state with new pattern parameters ---
    const drums = [
        {
            name: 'KICK',
            steps: 16,
            division: '16n',
            muted: false,
            currentStep: -1,
            // Pattern Synthesis Params
            pattern: { patternA: 4, patternB: 16, fill: 1, phase: 0 },
            // Modulation Params
            mods: { drift: 0, density: 0, gate: 0 },
            // Sound Params
            params: { pitch: 50, pitchDecay: 0.05, octaves: 6, decay: 0.3, filterFreq: 8000, filterQ: 1, level: 1 },
            fx: { drive: 0.1, bitCrush: 16, delay: 0, delayTime: 0.25, feedback: 0.3 }
        },
        {
            name: 'SNARE',
            steps: 16,
            division: '16n',
            muted: false,
            currentStep: -1,
            pattern: { patternA: 8, patternB: 16, fill: 1, phase: 4 },
            mods: { drift: 0, density: 0, gate: 0 },
            params: { pitch: 200, decay: 0.15, snap: 0.7, filterFreq: 8000, filterQ: 3, level: 1 },
            fx: { drive: 0, bitCrush: 16, delay: 0, delayTime: 0.25, feedback: 0.3 }
        },
        {
            name: 'HIHAT',
            steps: 32,
            division: '16n',
            muted: false,
            currentStep: -1,
            pattern: { patternA: 2, patternB: 3, fill: 0.7, phase: 1 },
            mods: { drift: 0.1, density: 0.05, gate: 0.1 },
            params: { pitch: 200, decay: 0.05, harmonicity: 12, modulationIndex: 32, filterFreq: 12000, filterQ: 1, level: 0.7 },
            fx: { drive: 0, bitCrush: 16, delay: 0.2, delayTime: 0.1875, feedback: 0.2 }
        },
        {
            name: 'CLAP',
            steps: 16,
            division: '16n',
            muted: false,
            currentStep: -1,
            pattern: { patternA: 8, patternB: 12, fill: 1, phase: 4 },
            mods: { drift: 0, density: 0, gate: 0 },
            params: { decay: 0.1, doubleTime: 0.05, spread: 0.02, filterFreq: 8000, filterQ: 2, level: 0.9 },
            fx: { drive: 0, bitCrush: 16, delay: 0, delayTime: 0.25, feedback: 0.3 }
        },
        {
            name: 'TOM',
            steps: 32,
            division: '16n',
            muted: false,
            currentStep: -1,
            pattern: { patternA: 7, patternB: 5, fill: 0.5, phase: 0 },
            mods: { drift: 0.2, density: 0, gate: 0.25 },
            params: { pitch: 120, pitchDecay: 0.08, octaves: 4, decay: 0.2, filterFreq: 4000, filterQ: 2, level: 1 },
            fx: { drive: 0, bitCrush: 16, delay: 0.3, delayTime: 0.375, feedback: 0.4 }
        },
        {
            name: 'PERC',
            steps: 32,
            division: '16n',
            muted: false,
            currentStep: -1,
            pattern: { patternA: 3, patternB: 5, fill: 0.6, phase: 2 },
            mods: { drift: 0.1, density: 0.1, gate: 0.15 },
            params: { pitch: 800, decay: 0.08, harmonicity: 8, modulationIndex: 16, filterFreq: 8000, filterQ: 4, level: 0.8 },
            fx: { drive: 0, bitCrush: 16, delay: 0.1, delayTime: 0.1875, feedback: 0.25 }
        }
    ];

    let isPlaying = false;
    let masterGain;

    // --- AUDIO INIT: Largely unchanged, synth definitions are the same ---
    async function initAudio() {
        masterGain = new Tone.Gain(Tone.dbToGain(-6)).toDestination();
        drums.forEach(drum => {
            // Synth creation (MembraneSynth, NoiseSynth, etc.)
            // This logic is identical to your original file.
            // For brevity, it's summarized here.
            // --- BEGINUNCHANGED ---
            drum.filter = new Tone.Filter(drum.params.filterFreq, 'lowpass', -12);
            drum.filter.Q.value = drum.params.filterQ;
            drum.distortion = new Tone.Distortion(drum.fx.drive);
            drum.delay = new Tone.FeedbackDelay(drum.fx.delayTime, drum.fx.feedback);
            drum.delay.wet.value = drum.fx.delay;
            drum.channelGain = new Tone.Gain(drum.params.level);
            if (drum.name === 'KICK' || drum.name === 'TOM') {
                drum.synth = new Tone.MembraneSynth({ pitchDecay: drum.params.pitchDecay, octaves: drum.params.octaves, envelope: { attack: 0.001, decay: drum.params.decay, sustain: 0, release: 0.01 } });
            } else if (drum.name === 'SNARE') {
                drum.synth = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: drum.params.decay, sustain: 0, release: 0.01 } });
                drum.toneSynth = new Tone.Synth({ oscillator: { type: 'triangle' }, envelope: { attack: 0.001, decay: drum.params.decay * 0.5, sustain: 0, release: 0.01 } });
            } else if (drum.name === 'HIHAT' || drum.name === 'PERC') {
                drum.synth = new Tone.MetalSynth({ frequency: drum.params.pitch, envelope: { attack: 0.001, decay: drum.params.decay, release: 0.01 }, harmonicity: drum.params.harmonicity, modulationIndex: drum.params.modulationIndex, resonance: 4000, octaves: 1.5 });
            } else if (drum.name === 'CLAP') {
                drum.synth = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: drum.params.decay, sustain: 0, release: 0.01 } });
            }
            if (drum.synth) { drum.synth.chain(drum.filter, drum.distortion, drum.delay, drum.channelGain, masterGain); }
            if (drum.toneSynth) { drum.toneSynth.connect(drum.filter); }
            // --- ENDUNCHANGED ---
        });
        console.log('✓ Audio initialization complete.');
    }

    // --- NEW: Trigger sound function (abstracted for clarity) ---
    function triggerDrum(drum, time) {
        if (!drum.synth) return;
        try {
            if (drum.name === 'KICK' || drum.name === 'TOM') drum.synth.triggerAttackRelease(Tone.Frequency(drum.params.pitch, "midi").toNote(), '8n', time);
            else if (drum.name === 'SNARE') {
                drum.synth.triggerAttackRelease('8n', time);
                if (drum.toneSynth) drum.toneSynth.triggerAttackRelease(Tone.Frequency(drum.params.pitch, "midi").toNote(), '16n', time);
            }
            else if (drum.name === 'HIHAT' || drum.name === 'PERC') drum.synth.triggerAttackRelease('32n', time);
            else if (drum.name === 'CLAP') {
                drum.synth.triggerAttackRelease('16n', time);
                drum.synth.triggerAttackRelease('16n', time + drum.params.doubleTime);
                drum.synth.triggerAttackRelease('16n', time + drum.params.doubleTime + drum.params.spread);
            }
        } catch (e) { console.error(`Error triggering ${drum.name}:`, e); }
    }


    // --- MODIFIED: Update pattern to be generative ---
    function updatePattern(drum) {
        if (drum.sequence) {
            drum.sequence.dispose();
        }

        const basePattern = generateFellPattern(drum.steps, drum.pattern.patternA, drum.pattern.patternB, drum.pattern.fill, drum.pattern.phase);

        drum.sequence = new Tone.Sequence((time, step) => {
            // --- GENERATIVE LOGIC HAPPENS HERE, PER STEP ---
            let trigger = basePattern[step];

            // 1. Gating: Chance to skip an active step
            if (trigger && Math.random() < drum.mods.gate) {
                trigger = false;
            }

            // 2. Drift: On the first step of a loop, possibly regenerate the pattern
            if (step === 0 && Math.random() < drum.mods.drift) {
                // Regenerate the underlying pattern for next loop
                const newBasePattern = generateFellPattern(drum.steps, drum.pattern.patternA, drum.pattern.patternB, drum.pattern.fill, drum.pattern.phase);
                for(let i=0; i<drum.steps; i++) basePattern[i] = newBasePattern[i];
                // Visual update needed for the drift
                Tone.Draw.schedule(() => updateStepDisplay(drum, basePattern), time + 0.01);
            }

            if (trigger && !drum.muted) {
                triggerDrum(drum, time);

                // 3. Density: Chance to add rapid-fire bursts (ratchets)
                if (Math.random() < drum.mods.density) {
                    const burstLength = Math.random() > 0.5 ? 3 : 2; // 2 or 3 extra hits
                    const divisionTime = Tone.Time(drum.division).toSeconds();
                    for (let i = 1; i < burstLength; i++) {
                        triggerDrum(drum, time + (divisionTime / 4) * i);
                    }
                }
            }

            // Visual update
            Tone.Draw.schedule(() => {
                drum.currentStep = step;
                updateStepDisplay(drum, basePattern);
            }, time);

        }, [...Array(drum.steps).keys()], drum.division);

        if (isPlaying) {
            drum.sequence.start(0);
        }
        updateStepDisplay(drum, basePattern);
    }

    // --- MODIFIED: Update step display ---
    function updateStepDisplay(drum, currentPattern) {
        const container = document.getElementById(`steps-${drum.name}`);
        if (!container) return;

        const pattern = currentPattern || generateFellPattern(drum.steps, drum.pattern.patternA, drum.pattern.patternB, drum.pattern.fill, drum.pattern.phase);
        container.innerHTML = '';

        for (let i = 0; i < drum.steps; i++) {
            const stepEl = document.createElement('div');
            stepEl.className = 'step';
            if (pattern[i]) stepEl.classList.add('active');
            if (i === drum.currentStep) stepEl.classList.add('playing');
            container.appendChild(stepEl);
        }
    }
    
    // --- MODIFIED: Create Channel UI with new controls ---
    function createChannelUI(drum) {
        const channel = document.createElement('div');
        channel.className = 'drum-channel';

        // Sound design HTML (e.g., pitch, decay) is unchanged
        // For brevity, it's summarized here.
        let soundHTML = `...`; // Identical to your original file

        channel.innerHTML = `
            <div class="channel-header">
                <span class="channel-name">${drum.name}</span>
                <div>
                    <button class="btn" id="reseed-${drum.name}" style="padding: 8px 12px; font-size: 12px;">RE-SEED</button>
                    <button class="btn mute-btn" id="mute-${drum.name}">MUTE</button>
                </div>
            </div>
            
            <div class="channel-controls">
                <div class="param-section">
                    <h3>Pattern Synthesis Engine</h3>
                    <div class="param-control">
                        <label>Steps</label>
                        <input type="range" id="steps-${drum.name}" min="4" max="64" value="${drum.steps}" step="1">
                        <span class="param-value" id="steps-${drum.name}-value">${drum.steps}</span>
                    </div>
                    <div class="param-control">
                        <label>Pattern A Length</label>
                        <input type="range" id="patternA-${drum.name}" min="1" max="32" value="${drum.pattern.patternA}" step="1">
                        <span class="param-value" id="patternA-${drum.name}-value">${drum.pattern.patternA}</span>
                    </div>
                    <div class="param-control">
                        <label>Pattern B Length</label>
                        <input type="range" id="patternB-${drum.name}" min="1" max="32" value="${drum.pattern.patternB}" step="1">
                        <span class="param-value" id="patternB-${drum.name}-value">${drum.pattern.patternB}</span>
                    </div>
                     <div class="param-control">
                        <label>Phase Shift</label>
                        <input type="range" id="phase-${drum.name}" min="0" max="31" value="${drum.pattern.phase}" step="1">
                        <span class="param-value" id="phase-${drum.name}-value">${drum.pattern.phase}</span>
                    </div>
                    <div class="param-control">
                        <label>Fill Chance</label>
                        <input type="range" id="fill-${drum.name}" min="0" max="1" value="${drum.pattern.fill}" step="0.01">
                        <span class="param-value" id="fill-${drum.name}-value">${drum.pattern.fill.toFixed(2)}</span>
                    </div>
                </div>

                <div class="param-section">
                    <h3>Modulation</h3>
                     <div class="param-control">
                        <label>Drift (Pattern Instability)</label>
                        <input type="range" id="drift-${drum.name}" min="0" max="1" value="${drum.mods.drift}" step="0.01">
                        <span class="param-value" id="drift-${drum.name}-value">${drum.mods.drift.toFixed(2)}</span>
                    </div>
                     <div class="param-control">
                        <label>Density (Burst Chance)</label>
                        <input type="range" id="density-${drum.name}" min="0" max="1" value="${drum.mods.density}" step="0.01">
                        <span class="param-value" id="density-${drum.name}-value">${drum.mods.density.toFixed(2)}</span>
                    </div>
                     <div class="param-control">
                        <label>Gate (Note Skip Chance)</label>
                        <input type="range" id="gate-${drum.name}" min="0" max="1" value="${drum.mods.gate}" step="0.01">
                        <span class="param-value" id="gate-${drum.name}-value">${drum.mods.gate.toFixed(2)}</span>
                    </div>
                </div>
                
                <div class="param-section">
                    <h3>Sound Design</h3>
                    </div>
            </div>
            
            <div class="step-display" id="steps-${drum.name}"></div>
        `;
        document.getElementById('channels').appendChild(channel);
        attachListeners(drum); // This function will need modification for new params
        updateStepDisplay(drum);
    }

    // --- MODIFIED: Attach listeners for new UI controls ---
    function attachListeners(drum) {
        const createListener = (elementId, valueId, targetObj, param, isFloat, unit = '', updateFn) => {
            const el = document.getElementById(elementId);
            const valEl = document.getElementById(valueId);
            if (el) {
                el.addEventListener('input', e => {
                    let value = isFloat ? parseFloat(e.target.value) : parseInt(e.target.value);
                    const keys = param.split('.');
                    let temp = targetObj;
                    for (let i = 0; i < keys.length - 1; i++) temp = temp[keys[i]];
                    temp[keys[keys.length - 1]] = value;

                    if (valEl) valEl.textContent = `${isFloat ? value.toFixed(2) : value}${unit}`;
                    if (updateFn) updateFn();
                });
            }
        };

        // NEW: Pattern Synthesis Listeners
        createListener(`steps-${drum.name}`, `steps-${drum.name}-value`, drum, 'steps', false, '', () => updatePattern(drum));
        createListener(`patternA-${drum.name}`, `patternA-${drum.name}-value`, drum, 'pattern.patternA', false, '', () => updatePattern(drum));
        createListener(`patternB-${drum.name}`, `patternB-${drum.name}-value`, drum, 'pattern.patternB', false, '', () => updatePattern(drum));
        createListener(`phase-${drum.name}`, `phase-${drum.name}-value`, drum, 'pattern.phase', false, '', () => updatePattern(drum));
        createListener(`fill-${drum.name}`, `fill-${drum.name}-value`, drum, 'pattern.fill', true, '', () => updatePattern(drum));

        // NEW: Modulation Listeners (These don't need to call updatePattern, they work in real-time)
        createListener(`drift-${drum.name}`, `drift-${drum.name}-value`, drum, 'mods.drift', true, '');
        createListener(`density-${drum.name}`, `density-${drum.name}-value`, drum, 'mods.density', true, '');
        createListener(`gate-${drum.name}`, `gate-${drum.name}-value`, drum, 'mods.gate', true, '');

        document.getElementById(`reseed-${drum.name}`).addEventListener('click', () => {
            updatePattern(drum);
        });

        // Mute button listener (unchanged)
        document.getElementById(`mute-${drum.name}`).addEventListener('click', e => {
            drum.muted = !drum.muted;
            e.target.classList.toggle('muted');
        });

        // --- All other listeners for sound parameters are unchanged ---
        // For brevity, they are not repeated here.
    }
    
    // --- Initialize Function (unchanged except for BPM) ---
    async function init() {
        console.log('Initializing...');
        drums.forEach(drum => createChannelUI(drum));
        await initAudio();
        drums.forEach(drum => updatePattern(drum));
        // All transport control listeners are the same
        document.getElementById('playBtn').addEventListener('click', async () => { /* ... */ });
        document.getElementById('stopBtn').addEventListener('click', () => { /* ... */ });
        document.getElementById('bpmInput').addEventListener('input', (e) => { Tone.Transport.bpm.value = parseInt(e.target.value); });
        document.getElementById('masterVolume').addEventListener('input', (e) => { /* ... */ });
        Tone.Transport.bpm.value = 125; // Set a good starting tempo
        console.log('Initialization complete');
    }

    // --- Full, unchanged init function content for copy-pasting ---
    async function fullInit() {
        console.log('Initializing...');
        drums.forEach(drum => createChannelUI(drum));
        await initAudio();
        drums.forEach(drum => updatePattern(drum));
        document.getElementById('playBtn').addEventListener('click', async () => {
            if (!isPlaying) {
                await Tone.start();
                Tone.Transport.start();
                drums.forEach(drum => { if (drum.sequence) drum.sequence.start(0); });
                isPlaying = true;
                document.getElementById('playBtn').classList.add('active');
            }
        });
        document.getElementById('stopBtn').addEventListener('click', () => {
            if (isPlaying) {
                Tone.Transport.stop();
                drums.forEach(drum => {
                    if (drum.sequence) drum.sequence.stop();
                    drum.currentStep = -1;
                    updateStepDisplay(drum);
                });
                isPlaying = false;
                document.getElementById('playBtn').classList.remove('active');
            }
        });
        document.getElementById('bpmInput').addEventListener('input', (e) => { Tone.Transport.bpm.value = parseInt(e.target.value); });
        document.getElementById('masterVolume').addEventListener('input', (e) => {
            const vol = parseFloat(e.target.value);
            if (masterGain) masterGain.gain.rampTo(Tone.dbToGain(vol), 0.1);
            document.getElementById('masterVolumeValue').textContent = `${vol} dB`;
        });
        Tone.Transport.bpm.value = 125;
        console.log('Initialization complete');
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fullInit);
    } else {
        fullInit();
    }
    </script>
</body>
</html>
